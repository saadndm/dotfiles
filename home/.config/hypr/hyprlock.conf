source = ~/.config/hypr/mocha.conf

general {
    hide_cursor = true
    fractional_scaling = 0
}

#BACKGROUND
background {
    monitor = 
    path = screenshot
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
    vibrancy_darkness = 0
}

# TIME (Hours)
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = $blue
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
    font_size = 300
    font_family = AlfaSlabOne
    position = 0%, -11.2%
    halign = center
    valign = top
}

# TIME (Minutes)
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = $text
    font_size = 300
    font_family = AlfaSlabOne
    position = 0%, -35.5%
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %b %A")"
    color = $subtext1
    font_size = 30
    font_family = JetBrainsMono NF ExtraBold
    position = 0%, -17.7%
    halign = center
    valign = center
}

# Input field
input-field {
    monitor =
    size = 20%, 8%
    outline_thickness = 3
    outer_color = $blue
    dots_size = 0.1
    dots_spacing = 1
    dots_center = true
    inner_color = $base
    font_color = $text
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##cdd6f4"> $USER</span>
    fail_text = <i>$PAMFAIL ($ATTEMPTS)</i>
    hide_input = false
    hide_input = false
    position = 0%, -30.5%
    halign = center
    valign = center
    zindex = 10
}

# Information
label {
    monitor =
    text = cmd[update:1000] echo -e "$(~/.config/scripts/lock-info.sh)"
    color = rgba(255, 255, 255, 1)
    font_size = 25
    font_family = JetBrainsMono NF ExtraBold
    position = -1%, 1%
    halign = right
    valign = botton
}
